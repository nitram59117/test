<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONYX</title>
<meta name="description" content="ONYX, le pilotage de soirées pour clubs et discothèques : billetterie, bar, caisses, sécurité et résultats.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://zdrjhepkyvoscfibbclf.supabase.co wss://zdrjhepkyvoscfibbclf.supabase.co https://api.shotgun.live; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/supabase.js"></script>
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/inter-latin-800-normal.woff2) format("woff2")}
/* ONYX — clair et posé, dans l'esprit d'un back-office de caisse : barre latérale blanche, fond gris très léger, cartes blanches,
   un seul bleu pour l'action et les données, le gris pour la comparaison. Layout : en-tête + barre latérale + contenu. */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel2:#f8f9fb; --line:#e4e7ec; --line2:#eef0f3; --ink:#1b2333; --muted:#667085;
  --accent:#1f5fd6; --accent-d:#174bb0; --accent-soft:#e9f0fd; --accent2:#7fa8ef; --cmp:#d3d8e0;
  --good:#12a150; --warn:#c98204; --bad:#d92d20;
  --font:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
header.top{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:6}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo img{height:20px;width:auto;display:block}
.logo small{font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:10px;letter-spacing:0}
.who{display:flex;align-items:center;gap:10px;font-weight:600;text-transform:uppercase;font-size:13px}
.who svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 56px)}
aside.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding-bottom:20px}
.side .club{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.side .club svg{width:20px;height:20px;flex:none;stroke:var(--ink);fill:none;stroke-width:1.6}
.side .club select{border:0;background:none;font-weight:700;text-transform:uppercase;font-size:13px;padding:4px 0;width:100%;cursor:pointer}
.side a{display:flex;gap:12px;align-items:center;padding:10px 18px;color:var(--ink);text-decoration:none;font-weight:500}
.side a:hover{background:var(--panel2)}
.side a.on{background:var(--accent);color:#fff}
.side a svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.side .grp{font-size:11px;color:var(--muted);padding:16px 18px 6px;font-weight:600}
main.content{padding:18px 24px 40px;min-width:0}
.ph{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.ph h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.ph .st{font-size:12px;color:var(--muted)}
.ph .st b{color:var(--good);font-weight:500}
.seg{display:inline-flex;background:var(--panel);border-radius:4px;box-shadow:0 1px 3px rgba(16,24,40,.1);overflow:hidden}
.seg button{padding:8px 30px;border:0;background:none;cursor:pointer;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
.filters{display:grid;grid-template-columns:minmax(260px,2fr) minmax(220px,1.4fr) auto;gap:14px;margin:6px 0 18px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;min-width:0}
.field{display:flex;min-width:0}
.field .in{border-radius:4px 0 0 4px;flex:1;min-width:0}
.field .ib{background:var(--accent);color:#fff;border:0;border-radius:0 4px 4px 0;width:34px;display:flex;align-items:center;justify-content:center;flex:none}
.field .ib svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.gk{grid-template-columns:repeat(2,minmax(0,1fr))}
.bnav,.sheet{display:none}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;min-width:0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.panel h3{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column;justify-content:space-between;min-height:84px}
.kpi .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:500}
.kpi .d{text-align:right;font-weight:500;white-space:nowrap}
.kpi .d small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.kpi .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:8px;letter-spacing:-.01em}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.huge{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 14px}
.pos{color:var(--good)} .neg{color:var(--bad)} .wrn{color:var(--warn)}
.lab{font-size:12px;color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:1px solid var(--line)}
tr.sub td:first-child{padding-left:22px}
tr.sub2 td:first-child{padding-left:36px;color:var(--muted)}
tr.dim td{color:var(--muted)}
tbody tr:hover td{background:var(--panel2)}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-weight:500;font-variant-numeric:tabular-nums}
.kv div span:first-child{font-weight:500}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line2);stroke-width:1}
.legend{display:flex;gap:18px;justify-content:center;font-size:12px;color:var(--ink);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{width:30px;height:11px;display:inline-block;border-radius:1px}
.note{color:var(--muted);font-size:12px;margin-top:10px;max-width:90ch}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--muted);font-weight:500;border:1px solid var(--line)}
.tag.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.b{background:#fdecea;color:var(--bad);border-color:transparent}
.tag.g{background:#e7f6ee;color:var(--good);border-color:transparent}
.tag.w{background:#fdf3e1;color:var(--warn);border-color:transparent}
.feed .it{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.feed .h{font-weight:600;font-variant-numeric:tabular-nums}
.feed .m{color:var(--muted);font-size:12px;margin-top:3px}
.prog{height:6px;background:var(--line2);border-radius:3px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.cmp{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cmp .rv{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.cmp .ev{font-size:22px;font-weight:600;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.banner{border-left:3px solid var(--accent);padding:12px 14px;border-radius:4px;background:var(--accent-soft);font-size:13px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600;border-radius:4px;white-space:nowrap}
.btn:hover{background:var(--accent-d)}
.ghost{background:var(--panel);border:1px solid var(--line);padding:8px 12px;font-size:13px;cursor:pointer;font-weight:500;border-radius:4px;white-space:nowrap;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm,.ghost.sm{padding:5px 10px;font-size:12px}
.danger{color:var(--bad)}
.in{background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:4px;min-width:0}
input.in{width:100%}
input.in.num{text-align:right;font-variant-numeric:tabular-nums}
input.in.s{width:100px}
input.in.xs{width:72px}
.in:hover{border-color:#c5cbd5}
.in:focus{border-color:var(--accent)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end}
.form label{display:flex;flex-direction:column;gap:4px}
.form label,.filters label{min-width:0}
select.in{max-width:100%;text-overflow:ellipsis}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:9px 0}
.hb .l{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.hb .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{height:9px;background:var(--line2);border-radius:2px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--accent)}
.hb.flop .t i{background:var(--accent2)}
.sw{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.sw button{border:0;background:var(--panel);padding:8px;cursor:pointer;font-weight:500}
.sw button.on{background:var(--accent);color:#fff}
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge svg{width:170px;height:auto}
.gauge .gv{font-size:22px;font-weight:700;margin-top:-56px}
.gauge .gl2{margin-top:34px;font-weight:500;text-align:center}
.wx{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wx .big{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips span{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;background:var(--panel2)}
#modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);padding:22px;max-width:520px;width:100%;border-radius:6px;box-shadow:0 20px 40px rgba(16,24,40,.2)}
.mbox h2{font-weight:600;margin:0 0 16px;font-size:18px}
.mbox .form{grid-template-columns:1fr 1fr}
.mbox .full{grid-column:1/-1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:13px;z-index:30;max-width:90vw}
.conn{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.conn h4{margin:0;font-size:17px;font-weight:600}
.journal div{padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}
footer{color:var(--muted);font-size:11px;padding:28px 0 10px}

.xbtn{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;width:28px;height:28px;border-radius:4px;cursor:pointer}
.xbtn:hover{background:#fdecea;color:var(--bad)}
input.in.wide{min-width:200px}
details.panel summary{cursor:pointer;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::before{content:"▸ ";color:var(--muted)}
details.panel[open] summary::before{content:"▾ "}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.lbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(16,24,40,.06)}
.llogo{height:22px;display:block;margin-bottom:22px}
.lbox h1{font-size:22px;margin:0 0 4px;font-weight:600}
.lerr{color:var(--bad);font-size:13px;min-height:18px}
.lfoot{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}
.lfoot a,footer a{color:var(--muted)}
.legal p{margin:0 0 12px;font-size:13px;line-height:1.55}
.mbox{max-height:90vh;overflow:auto}
.btn[disabled]{opacity:.5;cursor:default}

/* intro */
#intro{position:fixed;inset:0;z-index:200;background:#050507;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;animation:introOut .55s ease 1.55s forwards}
#intro .ilogo{position:relative;line-height:0}
#intro img{height:clamp(26px,5.5vw,60px);width:auto;filter:invert(1);opacity:0;animation:introLogo 1.1s cubic-bezier(.2,.7,.2,1) .1s forwards}
#intro .ilogo::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(120,165,255,.95) 50%,transparent 65%) no-repeat;background-size:250% 100%;background-position:120% 0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:sheen .9s ease .75s forwards}
#intro .iline{height:2px;width:0;background:#1f5fd6;border-radius:2px;animation:grow .8s cubic-bezier(.2,.7,.2,1) .45s forwards}
@keyframes introLogo{0%{opacity:0;transform:scale(1.12);filter:invert(1) blur(10px)}70%{opacity:1;filter:invert(1) blur(0)}100%{opacity:1;transform:scale(1);filter:invert(1) blur(0)}}
@keyframes sheen{to{background-position:-20% 0}}
@keyframes grow{to{width:clamp(80px,14vw,170px)}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#intro{animation:introOut .3s ease .4s forwards}#intro img{animation:none;opacity:1}#intro .ilogo::after,#intro .iline{display:none}}
/* agencement intermédiaire */
.gaff{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
@media (min-width:1700px){main.content{max-width:1720px}}
@media (min-width:901px) and (max-width:1180px){
  .layout{grid-template-columns:68px minmax(0,1fr)}
  .side .club,.side .grp{display:none}
  .side a{justify-content:center;padding:13px 0;font-size:0;gap:0}
  .side a svg{width:21px;height:21px}
  .filters{grid-template-columns:1fr 1fr}
  .filters .actions{grid-column:1/-1}
  .g21,.gaff{grid-template-columns:1fr}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:1181px) and (max-width:1360px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters .actions{grid-column:1/-1}}
@media (max-width:900px){.gaff{grid-template-columns:1fr}}
.sw2{width:40px;height:22px;border-radius:11px;border:0;background:#cfd5de;position:relative;cursor:pointer;padding:0;transition:background .15s}
.sw2 i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw2.on{background:var(--good)}.sw2.on i{left:21px}
tr.off td:not(:first-child){opacity:.45}

/* animations */
@media (prefers-reduced-motion:no-preference){
  .btn,.ghost,.xbtn,.side a,.bnav a,.bnav button,.sheet a,.seg button,.sw button,.in,td{transition:background-color .15s,border-color .15s,color .15s,box-shadow .2s,transform .12s}
  .btn:active,.ghost:active,.seg button:active,.sw button:active{transform:scale(.97)}
  .btn:hover{box-shadow:0 3px 10px rgba(31,95,214,.28)}
  .kpi{transition:box-shadow .2s,transform .2s}
  .kpi:hover{box-shadow:0 6px 16px rgba(16,24,40,.08);transform:translateY(-1px)}
  .side a.on svg,.bnav .on svg{animation:pop .3s cubic-bezier(.2,.7,.2,1)}
  .anim .ph,.anim .filters{animation:fadeUp .35s cubic-bezier(.2,.7,.2,1) both}
  .anim .panel{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both}
  .anim .grid > :nth-child(2){animation-delay:.04s}.anim .grid > :nth-child(3){animation-delay:.08s}.anim .grid > :nth-child(4){animation-delay:.12s}.anim .grid > :nth-child(5){animation-delay:.16s}
  .anim .stack > :nth-child(2){animation-delay:.06s}.anim .stack > :nth-child(3){animation-delay:.12s}.anim .stack > :nth-child(4){animation-delay:.18s}.anim .stack > :nth-child(5){animation-delay:.24s}
  .anim .cb{transform-box:fill-box;transform-origin:50% 100%;animation:growY .7s cubic-bezier(.2,.7,.2,1) .15s both}
  .anim .cbn{transform-box:fill-box;transform-origin:50% 0;animation:growY .7s cubic-bezier(.2,.7,.2,1) .15s both}
  .anim .cl,.anim .ga{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) .2s forwards}
  .anim .ca,.anim .cdot{animation:fade .6s ease .7s both}
  .anim .hb .t i,.anim .prog i,.anim .sbar i{transform-origin:0 50%;animation:growX .8s cubic-bezier(.2,.7,.2,1) .2s both}
  .anim .feed .it{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}
  .anim .feed .it:nth-child(2){animation-delay:.05s}.anim .feed .it:nth-child(3){animation-delay:.1s}.anim .feed .it:nth-child(4){animation-delay:.15s}.anim .feed .it:nth-child(n+5){animation-delay:.2s}
  .toast{animation:toastIn .3s cubic-bezier(.2,.7,.2,1)}
  #modal:not([hidden]){animation:fade .2s ease}
  .mbox{animation:pop .25s cubic-bezier(.2,.7,.2,1)}
  .sheet{animation:sheetUp .28s cubic-bezier(.2,.7,.2,1)}
  .lbox{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both}
  .lbox.late{animation-delay:1.7s}
  .lerr:not(:empty){animation:shake .35s}
  .ph .st b{display:inline-block;animation:fade .6s ease both}
  .stile{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.acct{background:none;border:0;padding:0;cursor:pointer;display:inline-flex}
.acct svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.6}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.ghost[disabled]{opacity:.35;cursor:default}
.prevbox{container-type:inline-size;border-radius:6px;overflow:hidden;border:1px solid var(--line)}

.sneg .sv{color:#ff6b5e}.spos .sv{color:#3ccf7d}

function chart(o){
  const sm = window.innerWidth < 700, W = o.w || (sm ? 420 : 960), H = sm ? Math.round((o.h || 260)*.9) : (o.h || 260), pl = sm ? 44 : 54, pr = (o.lines || []).some(l => l.right) ? 46 : 14, pt = 12, pb = 30;
  const labels = o.labels, N = labels.length, iw = W - pl - pr, ih = H - pt - pb;
  if (!N) return '<div class="empty">Pas encore de données.</div>';
  const lv = [...(o.bars || []).flatMap(b => b.values), ...(o.lines || []).filter(l => !l.right).flatMap(l => l.values)].filter(v => v != null && !isNaN(v));
  const rv = (o.lines || []).filter(l => l.right).flatMap(l => l.values).filter(v => v != null);
  const raw = Math.max(1, ...lv), mn0 = Math.min(0, ...lv), stp = niceMax((raw - mn0)/5);
  const mx = Math.ceil(raw/stp)*stp, mn = mn0 < 0 ? -Math.ceil(-mn0/stp)*stp : 0, TK = Math.round((mx - mn)/stp);
  const rmx = niceMax(Math.max(1, ...rv));
  const isBar = !!(o.bars && o.bars.length);
  const X = i => isBar ? pl + iw*(i + .5)/N : pl + (N > 1 ? iw*i/(N - 1) : iw/2);
  const Y = v => pt + ih*(1 - (v - mn)/(mx - mn)), YR = v => pt + ih*(1 - v/rmx);
  const f = o.fmt || (v => Math.abs(v) >= 1000 ? (v/1000).toLocaleString("fr-FR", {maximumFractionDigits:1}) + " k" : Math.round(v).toLocaleString("fr-FR"));
  let g = "";
  for (let k = 0; k <= TK; k++){ const v = mn + stp*k, y = Y(v); g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl - 8}" y="${y + 4}" text-anchor="end">${f(v)}</text>`;
  }
  if (pr > 20) for (let k = 0; k <= 4; k++) g += `<text class="ax" x="${W - pr + 8}" y="${YR(rmx*k/4) + 4}">${Math.round(rmx*k/4)}</text>`;
  const step = Math.ceil(N/(sm ? 6 : 14));
  labels.forEach((l, i) => { if (i % step === 0 || i === N - 1) g += `<text class="ax" x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
  (o.bars || []).forEach((b, bi) => { const nb = o.bars.length, bw = iw/N*.72/nb;

function delta(v, ref, invert, money){

  if (money && (ref < 0 || v < 0)){ const d = v - ref; return `<span class="${Math.abs(d) < 1 ? "" : d >= 0 ? "pos" : "neg"}">${d > 0 ? "+" : ""}${eur(d, 0)}</span><small>vs. comparée</small>`; }

  return `<span class="${Math.abs(d) < .5 ? "" : good ? "pos" : "neg"}">${(d > 0 ? "+" : "") + Math.round(d)}%</span><small>vs. comparée</small>`;
}

function sel(path, val, opts, extra = ""){ return `<select class="in" id="f-${path.replace(/\./g, "-")}" data-k="${path}" data-t="s" ${extra}>${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(val) ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select>`; }

const CVIEWS = [["saison","Rapports"],["affichage","Affichage"],["equipe","Équipe"],["connexions","Connexions"],["reglages","Réglages"]];

function statusSoiree(s){
  const st = startDate(s), en = new Date(st.getTime() + dureeH(s.ouverture, s.fermeture)*3600e3), now = Date.now();
  const fmt = ms => { const m = Math.floor(ms/60000), j = Math.floor(m/1440), h = Math.floor(m%1440/60), mi = m%60; return (j ? j + " j " : "") + (j || h ? h + " h " : "") + mi + " min"; };
  if (now < st) return ["Commence dans", fmt(st - now)];
  if (now < en) return ["En cours depuis", fmt(now - st)];
  return ["Soirée terminée depuis", fmt(now - en)];
}
function affLabels(s){ const out = []; const [h, m] = (s.ouverture || "00:00").split(":").map(Number); const steps = Math.round(dureeH(s.ouverture, s.fermeture)*2); for (let i = 0; i <= steps; i++){ const t = h*60 + m + i*30; out.push(String(Math.floor(t/60)%24).padStart(2, "0") + ":" + String(t%60).padStart(2, "0")); } return out; }

function cumAt(pts, h){ // pts : [heures avant début, cumul], triés du plus ancien au plus récent
  if (!pts.length) return null; if (h >= pts[0][0]) return pts[0][1]; if (h <= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for (let i = 1; i < pts.length; i++){ const [h0, v0] = pts[i-1], [h1, v1] = pts[i]; if (h <= h0 && h >= h1) return v0 + (v1 - v0)*(h0 - h)/(h0 - h1); } return null;
}
function ventesAxis(maxDays){ const ax = []; for (let d = maxDays; d >= 1; d--) ax.push(["J-" + d, d*24]); for (let h = 22; h >= 2; h -= 2) ax.push([h + "h", h]); ax.push(["J", 0]); for (let h = 2; h <= 8; h += 2) ax.push(["+" + h + "h", -h]); return ax; }

  ${tar.map((t, i) => `<tr><td>${inp("s.tarifs." + i + ".nom", t.nom, "wide")}${t.sg ? ' <span class="tag a" title="Mis à jour par Shotgun">Shotgun</span>' : ""}</td><td>${sel("s.tarifs." + i + ".canal", t.canal, CANAUX)}</td><td class="r">${inp("s.tarifs." + i + ".billets", t.billets, "num xs")}</td><td class="r">${inp("s.tarifs." + i + ".prix", t.prix, "num xs")}</td><td class="r">${eur(n(t.billets)*n(t.prix))}</td><td class="r">${eur(n(t.billets)*n(t.prix)/tvaB)}</td><td><button class="xbtn" data-act="del" data-arr="tarifs" data-i="${i}" aria-label="Retirer ce tarif" title="Retirer">×</button></td></tr>`).join("") || '<tr><td colspan="7" class="empty">Aucun tarif.</td></tr>'}

function vSecu(s, c, k){
  const rec = s.recales || [], itv = s.interventions || [];

  const f = S.filtreSecu;
  const feed = [...(f !== "int" ? rec.map((r, i) => ({type:"rec", i, ...r})) : []), ...(f !== "rec" ? itv.map((r, i) => ({type:"int", i, ...r})) : [])].sort((a, b) => (b.h || "").localeCompare(a.h || ""));
  const labs = affLabels(s);
  if ((s.affluence || []).length !== labs.length) s.affluence = labs.map((_, i) => (s.affluence || [])[i] ?? "");

  ${kpi("Sorties de l'établissement", itv.filter(i => i.sortie).length, cs && (cs.interventions || []).filter(i => i.sortie).length, int, "parmi les interventions", true)}

function vBar(s, c, k){
  const hrs = Math.ceil(dureeH(s.ouverture, s.fermeture)), [h0] = (s.ouverture || "00:00").split(":").map(Number);
  const labs = Array.from({length:hrs}, (_, i) => ((h0 + i)%24) + "h");
  const aff = s.affluence || [];
  const presH = labs.map((_, i) => aff[i*2 + 1] !== undefined && aff[i*2 + 1] !== "" ? n(aff[i*2 + 1]) : null);
  const hor = labs.map((_, i) => s.bar.horaire && s.bar.horaire[i] != null ? n(s.bar.horaire[i]) : null);
  const cm = cmpOf(s, c), ck = cm && cm.k;
  const diffCls = d => d == null ? "" : Math.abs(d) < 1 ? "pos" : d > 0 ? "wrn" : "neg";
  const prods = (s.bar.produits || []).slice().sort((a, b) => b[2] - a[2]);

function vSaison(c){
  const per = S.periode || "mois";
  const monday = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6)%7)); return x.toISOString().slice(0, 10); };
  const today = "2026-11-17";
  const withData = c.soirees.filter(x => x.date < today && calc(x, c).hasData).map(x => x.date).sort().reverse();
  const keyOf = d => per === "annee" ? d.slice(0, 4) : per === "mois" ? d.slice(0, 7) : per === "semaine" ? monday(new Date(d + "T12:00")) : "tout";
  const keys = [...new Set(withData.map(keyOf))];
  const keyLab = k => per === "annee" ? k : per === "mois" ? new Date(k + "-15T12:00").toLocaleDateString("fr-FR", {month:"long", year:"numeric"}) : per === "semaine" ? "Semaine du " + new Date(k + "T12:00").toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"}) : "Toutes les soirées";
  const curKey = keys.includes(S.repKey) ? S.repKey : keys[0];
  const s = {date: curKey === "tout" || !curKey ? (withData[0] || "2026-01-01") : per === "annee" ? curKey + "-06-15" : per === "mois" ? curKey + "-15" : curKey};
  const ref = new Date(s.date + "T12:00");
  const picker = `<div class="filters" style="grid-template-columns:minmax(220px,360px)"><label for="f-rep">Période<span class="field"><select class="in" id="f-rep" data-k="S.repKey" data-t="s">${keys.map(k => `<option value="${k}" ${k === curKey ? "selected" : ""}>${esc(keyLab(k))}</option>`).join("")}</select><span class="ib">${ic("cal")}</span></span></label></div>`;
  const inPer = d => per === "tout" ? true : per === "annee" ? d.slice(0, 4) === s.date.slice(0, 4) : per === "mois" ? d.slice(0, 7) === s.date.slice(0, 7) : monday(new Date(d + "T12:00")) === monday(ref);
  const perLab = per === "tout" ? "toute la saison" : per === "annee" ? "l'année " + s.date.slice(0, 4) : per === "mois" ? ref.toLocaleDateString("fr-FR", {month:"long", year:"numeric"}) : "la semaine du " + new Date(monday(ref) + "T12:00").toLocaleDateString("fr-FR", {day:"numeric", month:"long"});
  const rows = c.soirees.filter(x => x.date < today && inPer(x.date)).map(x => ({x, k:calc(x, c)})).filter(o => o.k.hasData).sort((a, b) => a.x.date.localeCompare(b.x.date));
  if (!rows.length) return picker + '<div class="panel empty">Aucune soirée avec des chiffres sur cette période.</div>';
  const T = f => sum(rows, f);
  const ebeT = T(o => o.k.ebe);
  return picker + `<div class="grid g5">
  ${stat("Soirées", rows.length, "avec chiffres")}
  ${stat("Entrées", int(T(o => o.k.scannes)), int(T(o => o.k.scannes)/rows.length) + " en moyenne")}
  ${stat("CA TTC", eur(T(o => o.k.caTTC), 0), eur(T(o => o.k.caTTC)/rows.length, 0) + " par soirée")}
  ${stat("Bar par entrée", eur(T(o => o.k.barTTC)/Math.max(1, T(o => o.k.scannes))), "moyenne pondérée")}
  ${stat("EBE cumulé", eur(ebeT, 0), eur(ebeT/rows.length, 0) + " par soirée", sgn(ebeT))}
</div>
<div class="panel" style="margin-top:14px"><h3>EBE par soirée</h3>${chart({labels:rows.map(o => dayShort(o.x.date)), bars:[{name:"EBE", values:rows.map(o => Math.round(o.k.ebe)), color:css("--accent"), colorFn:v => v < 0 ? css("--bad") : css("--good")}], h:240})}</div>
<div class="panel" style="margin-top:14px"><h3>Toutes les soirées</h3><div class="tw"><table>
  <tr><th>Date</th><th>Soirée</th><th class="r">Billets</th><th class="r">Scannés</th><th class="r">Billetterie TTC</th><th class="r">Bar TTC</th><th class="r">€/entrée</th><th class="r">EBE</th></tr>
  ${rows.slice().reverse().map(o => `<tr><td>${dayShort(o.x.date)}</td><td><a href="#tableau" data-act="open" data-id="${o.x.id}" style="color:inherit">${esc(o.x.nom)}</a></td><td class="r">${int(o.k.billets)}</td><td class="r">${int(o.k.scannes)}</td><td class="r">${eur(o.k.ttcB, 0)}</td><td class="r">${eur(o.k.barTTC, 0)}</td><td class="r">${eur(o.k.parEntree)}</td><td class="r ${sgn(o.k.ebe)}"><b>${eur(o.k.ebe, 0)}</b></td></tr>`).join("")}
  <tr class="tot"><td colspan="2">Total</td><td class="r">${int(T(o => o.k.billets))}</td><td class="r">${int(T(o => o.k.scannes))}</td><td class="r">${eur(T(o => o.k.ttcB), 0)}</td><td class="r">${eur(T(o => o.k.barTTC), 0)}</td><td></td><td class="r ${sgn(ebeT)}">${eur(ebeT, 0)}</td></tr>
</table></div></div>`;
}

async function unlockBlob(blob, pass){
  try {
    const ub = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:ub(blob.salt), iterations:blob.it, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub(blob.iv)}, key, ub(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch(e){ return null; }
}

async function doLogin(){
  const st = S._login || {step:"login"};
  const fail = msg => { S._login = {...st, err:msg, mail:($("#lg-mail") || {}).value || st.mail}; render(); };
  if (Date.now() < lockUntil) return fail("Trop d'essais. Réessaie dans 30 secondes.");
  const mail = normMail(($("#lg-mail") || {}).value || st.mail);
  const okMail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail);
  const pwOk = p => p.length >= 8 && /[a-zA-Z]/.test(p) && /\d/.test(p);
  try {
    if (st.step === "login"){
      if (!okMail) return fail("Saisis une adresse e-mail valide.");
      const {data, error} = await sb.auth.signInWithPassword({email:mail, password:$("#lg-pass").value});
      if (error){ tries++; if (tries >= 5){ lockUntil = Date.now() + 30000; tries = 0; } return fail(friendlyErr(error)); }
      tries = 0; return enterOnline(data.user);
    }
    if (st.step === "signup"){
      const p1 = $("#lg-p1").value, p2 = $("#lg-p2").value;
      if (!okMail) return fail("Saisis une adresse e-mail valide.");
      if (!pwOk(p1)) return fail("Le mot de passe doit faire 8 caractères minimum, avec au moins une lettre et un chiffre.");
      if (p1 !== p2) return fail("Les deux mots de passe ne correspondent pas.");
      const {data, error} = await sb.auth.signUp({email:mail, password:p1, options:{emailRedirectTo:SITE}});
      if (error) return fail(friendlyErr(error));
      if (data.session) return enterOnline(data.user);
      S._login = {step:"sent", mail, msg:"Un e-mail de confirmation a été envoyé à " + mail + ". Clique sur le lien qu'il contient pour activer ton compte, puis connecte-toi."}; render(); return;
    }
    if (st.step === "forgot"){
      if (!okMail) return fail("Saisis une adresse e-mail valide.");
      const {error} = await sb.auth.resetPasswordForEmail(mail, {redirectTo:SITE});
      if (error) return fail(friendlyErr(error));
      S._login = {step:"sent", mail, msg:"Si un compte existe pour " + mail + ", un lien pour choisir un nouveau mot de passe vient d'être envoyé."}; render(); return;
    }
    if (st.step === "newpass"){
      const p1 = $("#lg-p1").value, p2 = $("#lg-p2").value;
      if (!pwOk(p1)) return fail("Le mot de passe doit faire 8 caractères minimum, avec au moins une lettre et un chiffre.");
      if (p1 !== p2) return fail("Les deux mots de passe ne correspondent pas.");
      const {data, error} = await sb.auth.updateUser({password:p1});
      if (error) return fail(friendlyErr(error));
      toast("Mot de passe enregistré."); return enterOnline(data.user);
    }
  } catch(e){ return fail(friendlyErr(e)); }
}

async function sgSync(c, silent){
  if (sgBusy) return; const org = String(c.connexions.shotgun.orgId || "").trim(), tok = sgToken(c.id);
  if (!org || !tok){ if (!silent) toast("Renseigne l'Organizer ID et le jeton Shotgun."); return; }
  sgBusy = true; c.connexions.shotgun.status = "Synchronisation en cours…"; if (S.view === "connexions") render();
  const st = sgStore(c.id);
  if (!st.after){ const d = new Date(Date.now() - 120*864e5); st.after = d.toISOString(); }
  let url = SG_API + "?organizer_id=" + encodeURIComponent(org) + "&include_cohosted_events=1&after=" + encodeURIComponent(st.after), pages = 0, n = 0;
  try {
    while (url && pages < 400){
      const r = await fetch(url, {headers:{Authorization:"Bearer " + tok}});
      if (r.status === 401 || r.status === 403) throw new Error("Jeton refusé par Shotgun. Vérifie l'Organizer ID et génère un nouveau jeton.");
      if (r.status === 429){ await new Promise(res => setTimeout(res, 20000)); continue; }
      if (!r.ok) throw new Error("Shotgun a répondu " + r.status + ".");
      const js = await r.json(), data = js.data || [];

        st.tickets[t.ticket_id] = [t.event_id, t.event_start_time, t.deal_title || "Billet", t.deal_channel || "online", t.deal_price || 0, t.ticket_status, t.ordered_at, t.ticket_scanned_at ? 1 : 0];

      }
      pages++;
      const next = js.pagination && js.pagination.next;
      if (!data.length || !next) break;
      const nu = new URL(next); nu.searchParams.delete("token"); url = nu.toString();
      await new Promise(res => setTimeout(res, 700));
    }
    const changed = sgApply(c, st);
    if (!sgSave(c.id, st)){ const cut = Date.now() - 120*864e5; for (const [id, t] of Object.entries(st.tickets)) if (new Date(t[1]).getTime() < cut) delete st.tickets[id]; sgSave(c.id, st); }
    c.connexions.shotgun.connected = true; c.connexions.shotgun.last = new Date().toISOString();
    c.connexions.shotgun.status = ""; if (n || !silent) sgLog(c, true, `${n} billet${n > 1 ? "s" : ""} reçu${n > 1 ? "s" : ""}, ${changed} soirée${changed > 1 ? "s" : ""} mise${changed > 1 ? "s" : ""} à jour`);
    if (!silent) toast(`Shotgun synchronisé : ${n} billets reçus.`);
  } catch(e){
    c.connexions.shotgun.status = ""; const msg = e.message && e.message.startsWith("Jeton") || e.message.startsWith("Shotgun") ? e.message : "Shotgun injoignable (connexion internet ?).";
    sgLog(c, false, msg); if (!silent) toast(msg);
  }

}
function sgApply(c, st){
  const ev = {};
  for (const t of Object.values(st.tickets)){ (ev[t[0]] = ev[t[0]] || {start:t[1], list:[]}).list.push(t); }
  let changed = 0;
  for (const [eid, e] of Object.entries(ev)){
    const date = soireeDateOf(e.start);
    let s = c.soirees.find(x => String(x.shotgunEventId) === String(eid)) || c.soirees.find(x => x.date === date && !x.shotgunEventId);
    if (!s){ s = emptySoiree(c, date, "Événement Shotgun n° " + eid, "", new Date(e.start).toTimeString().slice(0, 5), "06:00"); c.soirees.push(s); }
    s.shotgunEventId = eid;
    const valid = e.list.filter(t => t[5] === "valid");
    const tar = {};
    for (const t of valid){ const canal = /suppl/i.test(t[2]) ? "Supplément" : (SG_CANAL[t[3]] || "En ligne"); const k = t[2] + "|" + canal; const o = tar[k] || (tar[k] = {nom:t[2], canal, billets:0, tot:0}); o.billets++; o.tot += t[4]/100; }
    const fromSg = Object.values(tar).map(o => ({nom:o.nom, canal:o.canal, billets:o.billets, prix:o.billets ? Math.round(o.tot/o.billets*100)/100 : 0, sg:true}));
    s.tarifs = [...fromSg, ...(s.tarifs || []).filter(t => !t.sg && t.canal === "Autre billetterie")];
    s.scannes = valid.filter(t => t[7]).length || s.scannes;
    const st0 = new Date(e.start).getTime(), hb = valid.map(t => (st0 - new Date(t[6]).getTime())/36e5).sort((a, b) => b - a);
    const step = Math.max(1, Math.ceil(hb.length/200));
    s.ventes = hb.filter((_, i) => i % step === 0 || i === hb.length - 1).map((h, i, arr) => [Math.round(h*100)/100, Math.min(hb.length, (i === arr.length - 1 ? hb.length : i*step + 1))]);
    s.ventesDemo = false; changed++;
  }
  c.soirees.sort((a, b) => b.date.localeCompare(a.date));
  return changed;
}

function caisseRows(s, c, k){

    const ck = x.vest ? "s.noteVest" : x.i == null ? "s.noteBillet" : "s.caisses." + x.i + ".commentaire";
    const com = x.vest ? s.noteVest : x.i == null ? s.noteBillet : (s.caisses[x.i] || {}).commentaire;
    const st = x.diff == null ? ["à saisir", "", "w"] : Math.abs(x.diff) < 0.01 ? ["juste", "g", "g"] : Math.abs(x.diff) <= seuil ? ["écart faible", "a", "a"] : ["à justifier", "b", "b"];
    return {...x, ck, com:com || "", st, seuil};
  });
}

async function readRows(file){
  if (!window.XLSX) throw new Error("Le lecteur Excel n'a pas pu se charger.");
  const wb = XLSX.read(await file.arrayBuffer(), {type:"array", cellDates:true});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:""});
}
const norm = v => String(v).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function findHeader(rows, must){ for (let i = 0; i < Math.min(rows.length, 30); i++){ const r = rows[i].map(norm); if (must.some(m => r.some(c => c.includes(m)))) return i; } return -1; }
const col = (h, keys, not = []) => h.findIndex(c => keys.some(k => c.includes(k)) && !not.some(k => c.includes(k)));
function toDate(v){ if (v instanceof Date) return v; if (typeof v === "number") return new Date(Math.round((v - 25569)*864e5)); const s = String(v).trim(); let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ T]?(\d{1,2})?:?(\d{2})?/); if (m) return new Date(+m[3], +m[2]-1, +m[1], +(m[4] || 0), +(m[5] || 0)); const d = new Date(s.replace(" ", "T")); return isNaN(d) ? null : d; }
async function importTrivec(file){
  const s = cur(), rows = await readRows(file);
  const hi = findHeader(rows, ["produit","article","libelle"]); if (hi < 0) throw new Error("Colonne Produit introuvable dans le rapport.");
  const h = rows[hi].map(norm), cP = col(h, ["produit","article","libelle"]), cQ = col(h, ["quant","qte","nombre","nb"]), cT = col(h, ["ttc"]), cH = col(h, ["ht"], ["ttc","heure"]), cHr = col(h, ["heure","hour"]);
  const cT2 = cT >= 0 ? cT : col(h, ["total","montant","ca"], ["ht"]);
  if (cT2 < 0) throw new Error("Colonne Total TTC introuvable.");
  const prods = {}, hor = []; let ttc = 0, ht = 0; const [h0] = (s.ouverture || "00:00").split(":").map(Number);
  for (const r of rows.slice(hi + 1)){ const p = String(r[cP] || "").trim(); if (!p || /^total/i.test(p)) continue;
    const q = n(r[cQ]), t = n(r[cT2]), x = cH >= 0 ? n(r[cH]) : t/1.2; ttc += t; ht += x;
    const o = prods[p] || (prods[p] = [p, 0, 0, 0]); o[1] += q; o[2] += t; o[3] += x;
    if (cHr >= 0 && r[cHr] !== ""){ let hh = r[cHr] instanceof Date ? r[cHr].getHours() : typeof r[cHr] === "number" && r[cHr] < 1 ? Math.floor(r[cHr]*24) : parseInt(String(r[cHr])); if (!isNaN(hh)){ const i = (hh - h0 + 24)%24; hor[i] = (hor[i] || 0) + t; } } }
  s.bar = {ttc:Math.round(ttc*100)/100, ht:Math.round(ht*100)/100, horaire:Array.from(hor, v => v || 0), produits:Object.values(prods).map(p => [p[0], p[1], Math.round(p[2]*100)/100, Math.round(p[3]*100)/100])};
  club().connexions.trivec.journal.push({ok:true, t:new Date().toLocaleString("fr-FR"), d:`Rapport ${file.name} : ${Object.keys(prods).length} produits, ${eur(ttc)} TTC${cHr < 0 ? " (pas de colonne Heure)" : ""}`});
  return `Rapport Trivec importé : ${Object.keys(prods).length} produits, ${eur(ttc)} TTC.`;
}
async function importShotgun(file){
  const s = cur(), rows = await readRows(file);

  const h = rows[hi].map(norm), cTa = col(h, ["tarif","ticket","deal","categ","rate"], ["id","date","statut","status"]), cPr = col(h, ["prix","price","montant","amount"]), cD = col(h, ["date","created","commande","order"]), cSc = col(h, ["scan","check","valid"]);
  const tar = {}, times = []; let scans = 0; const st = startDate(s);
  for (const r of rows.slice(hi + 1)){ const t = String(r[cTa] || "").trim(); if (!t) continue; const p = cPr >= 0 ? n(r[cPr]) : 0;
    const o = tar[t] || (tar[t] = {nom:t, canal:p > 0 ? "En ligne" : "Invitation", billets:0, tot:0}); o.billets++; o.tot += p;
    if (cD >= 0){ const d = toDate(r[cD]); if (d) times.push((st - d)/36e5); }

  s.tarifs = [...enLigne, ...s.tarifs.filter(x => !["En ligne","Invitation"].includes(x.canal))];
  if (times.length){ times.sort((a, b) => b - a); s.ventes = times.map((hb, i) => [Math.round(hb*100)/100, i + 1]); s.ventesDemo = false; }
  if (scans) s.scannes = scans;
  const tot = sum(enLigne, x => x.billets);
  club().connexions.shotgun.journal.push({ok:true, t:new Date().toLocaleString("fr-FR"), d:`Export ${file.name} : ${tot} billets, ${enLigne.length} tarifs${scans ? ", " + scans + " scannés" : ""}`});
  return `Export Shotgun importé : ${tot} billets sur ${enLigne.length} tarifs${times.length ? ", courbe des ventes tracée" : ""}.`;
}

/* ---- tableau d'exploitation (un onglet = une soirée) ---- */
const MOIS = ["janvier","fevrier","mars","avril","mai","juin","juillet","aout","septembre","octobre","novembre","decembre"];
const numX = v => { if (typeof v === "number") return v; const t = String(v ?? "").replace(/[^\d,.\-]/g, "").replace(",", "."); const x = parseFloat(t); return isNaN(x) ? null : x; };
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function frDate(v){
  if (v instanceof Date && !isNaN(v)) return ymd(new Date(v.getTime() + 12*36e5));
  if (typeof v === "number" && v > 30000) return ymd(new Date(Math.round((v - 25569)*864e5) + 12*36e5));
  const s = norm(v), m = s.match(/(\d{1,2})(?:er)?\s+([a-z]+)\s+(\d{4})/);
  if (m){ const mo = MOIS.indexOf(m[2]); if (mo >= 0) return m[3] + "-" + String(mo + 1).padStart(2, "0") + "-" + m[1].padStart(2, "0"); }
  const d = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return d ? d[3] + "-" + d[2].padStart(2, "0") + "-" + d[1].padStart(2, "0") : null;
}
function parseExploitation(rows){
  const lab = r => norm(String(r[0] ?? "").replace(/\s+/g, " ").trim());
  const first = k => { const r = rows.find(r => lab(r) === k); return r ? r[1] : ""; };
  const date = frDate(first("date")); if (!date) return null;
  const right = (k, col = 6) => { const r = rows.find(r => norm(String(r[3] ?? "").replace(/\s+/g, " ").trim()) === k); return r ? numX(r[col]) : null; };
  const rightLab = k => { const r = rows.find(r => norm(String(r[5] ?? "")).trim() === k); return r ? numX(r[6]) : null; };
  const firstNum = k => { const r = rows.find(r => lab(r) === k); return r ? numX(r[1]) : null; };
  const tarifs = []; let canal = null;
  for (const r of rows){
    const t = norm(String(r[3] ?? "").replace(/\s+/g, " ").trim());
    if (t.startsWith("billetterie preventes")){ canal = "En ligne"; continue; }
    if (t.startsWith("billetterie sur place")){ canal = "Sur place"; continue; }
    if (t.startsWith("code promo") || t.startsWith("frais shotgun") || t.startsWith("total")){ canal = null; continue; }
    if (!canal || !t) continue;
    const prix = numX(r[4]), nb = numX(r[5]); if (prix == null || !nb) continue;
    tarifs.push({nom:String(r[3]).trim(), canal:/supp/.test(t) ? "Supplément" : canal, billets:nb, prix});
  }
  const [ouv, ferm] = String(first("horaires") || "").split(/\s*[-–à]\s*/);
  const ttcB = sum(tarifs, x => x.billets*x.prix), htB = right("total billetterie ht");
  const sacem = rightLab("sacem"), cnm = rows.filter(r => norm(String(r[5] ?? "")).trim() === "cnm").map(r => numX(r[6]))[0];
  const contrat = norm(first("type contrat"));
  return {date, nom:String(first("evenement") || "").trim(), style:String(first("styles") || "").trim(), ouv:/^\d/.test(ouv || "") ? ouv.trim() : "", ferm:/^\d/.test(ferm || "") ? ferm.trim() : "",
    tarifs, ttcB, sacemPct:htB && sacem ? Math.round(sacem/htB*10000)/100 : null, cnmPct:htB && cnm ? Math.round(cnm/htB*10000)/100 : null,
    partClub:/cession/.test(contrat) ? 100 : null,
    artistique:firstNum("artistique"), promo:firstNum("promo"), production:firstNum("production"), secu:firstNum("securite"), extras:firstNum("personnels extra"), salle:firstNum("cout de la salle"),
    barHT:right("ca bar ht"), vestHT:right("ca vestiaire ht"), resultat:right("resultat")};
}
async function readBook(file){
  if (!window.XLSX) throw new Error("Le lecteur Excel n'a pas pu se charger.");
  const buf = await file.arrayBuffer();
  if (/\.csv$/i.test(file.name)){
    let txt; try { txt = new TextDecoder("utf-8", {fatal:true}).decode(buf); } catch(e){ txt = new TextDecoder("windows-1252").decode(buf); }
    const FS = (txt.match(/;/g) || []).length > (txt.match(/,/g) || []).length ? ";" : ",";
    const wb = XLSX.read(txt, {type:"string", FS, raw:true});
    return [[file.name, XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:""})]];
  }
  const wb = XLSX.read(buf, {type:"array", cellDates:true});
  return wb.SheetNames.map(nm => [nm, XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, raw:true, defval:""})]);
}
async function importExploitation(files){
  const c = club(), vide = v => v === "" || v == null; let crees = 0, maj = 0, ign = 0, remplace = 0; const ecarts = [];
  for (const f of files) for (const [, rows] of await readBook(f)){
    const x = parseExploitation(rows); if (!x){ ign++; continue; }
    let s = c.soirees.find(o => o.date === x.date), neuf = !s;
    const foi = !!c.config.exploitAvant && x.date < c.config.exploitAvant;
    if (neuf){ s = emptySoiree(c, x.date, x.nom ? (c.nom.toUpperCase() + " : " + x.nom) : "Soirée du " + x.date, x.style, x.ouv || "00:00", x.ferm || "06:00"); s.personnel = []; c.soirees.push(s); crees++; } else maj++;
    const ecrase = neuf || foi, put = (k, v) => { if (v != null && (ecrase || vide(s[k]))) s[k] = v; };
    if (foi && !neuf){ if (x.nom && vide(s.nom)) s.nom = x.nom; if (x.style) s.style = x.style; if (x.ouv) s.ouverture = x.ouv; if (x.ferm) s.fermeture = x.ferm; }
    if (x.tarifs.length && (ecrase || !(s.tarifs || []).length)) s.tarifs = x.tarifs;
    if (x.sacemPct != null) put("sacemPct", x.sacemPct); if (x.cnmPct != null) put("cnmPct", x.cnmPct); if (x.partClub != null) put("partClub", x.partClub);
    const prod = (x.artistique || 0) + (x.production || 0);
    if (ecrase || vide(s.depenses.production)) if (x.artistique != null || x.production != null) s.depenses.production = Math.round(prod*100)/100;
    if (x.promo != null && (ecrase || vide(s.depenses.promo))) s.depenses.promo = x.promo;
    put("depSecu", x.secu); put("depExtras", x.extras); if (ecrase) s.depAutresPers = 0; put("coutSalle", x.salle);
    if (x.barHT != null && (ecrase || vide(s.bar.ht))){ s.bar.ht = x.barHT; if (vide(s.bar.ttc) || (foi && !(s.bar.produits || []).length)) s.bar.ttc = Math.round(x.barHT*1.2*100)/100; }
    if (x.vestHT != null && (ecrase || vide(s.encVest))){ s.encVest = Math.round(x.vestHT*(1 + n(c.config.tvaVest)/100)); if (vide(s.vestTickets) || foi) s.vestTickets = Math.round(s.encVest/vestPrix(c)); }
    if (foi && !neuf) remplace++;
    if (x.resultat != null) s.ebeRef = x.resultat;
    if (x.resultat != null){ const e = calc(s, c).ebe; if (Math.abs(e - x.resultat) > 50) ecarts.push(dayShort(x.date) + " (" + eur(e, 0) + " au lieu de " + eur(x.resultat, 0) + ")"); }
  }
  c.soirees.sort((a, b) => b.date.localeCompare(a.date));
  if (!crees && !maj) throw new Error("aucun onglet de soirée reconnu (ligne DATE introuvable).");
  return `Tableau d'exploitation importé : ${crees} soirée${crees > 1 ? "s" : ""} créée${crees > 1 ? "s" : ""}, ${maj} complétée${maj > 1 ? "s" : ""}${remplace ? " (dont " + remplace + " remplacée" + (remplace > 1 ? "s" : "") + " par les valeurs du tableau)" : ""}${ign ? ", " + ign + " onglet" + (ign > 1 ? "s" : "") + " ignoré" + (ign > 1 ? "s" : "") : ""}.` + (ecarts.length ? " Résultat différent pour : " + ecarts.slice(0, 4).join(", ") + "." : "");
}

  if (/^c\.equipe\.\d+\.email$/.test(el.dataset.k)){ const v2 = normMail(val); if (v2 && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v2)){ toast("Adresse e-mail invalide."); render(); return; } const j2 = +el.dataset.k.split(".")[2]; if (v2 && S.clubs.some(cc => cc.equipe.some(m => normMail(m.email) === v2 && m !== club().equipe[j2]))){ toast("Cette adresse est déjà utilisée par un autre compte."); render(); return; } setPath(el.dataset.k, v2); save(); render(); return; }
  if (/^c\.equipe\.\d+\.acces$/.test(el.dataset.k) && val !== "Administrateur" && club().equipe.filter(m => m.acces === "Administrateur").length === 1 && club().equipe[+el.dataset.k.split(".")[2]].acces === "Administrateur"){ toast("Il faut garder au moins un administrateur."); render(); return; }
  setPath(el.dataset.k, el.dataset.k === "c.affichage.cols" ? +val : val); save(); render();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, c = club(), s = cur(), i = +b.dataset.i;
  if (act === "demo"){ e.preventDefault(); startDemo(); return; }
  if (act === "lgStep"){ e.preventDefault(); S._login = {step:b.dataset.v, mail:(S._login || {}).mail}; render(); return; }
  if (act === "createClub"){ const nm = ($("#ob-n").value || "").trim(); if (!nm){ toast("Indique le nom de l'établissement."); return; } createClubOnline(nm, $("#ob-v").value.trim(), $("#ob-j").value, 0); return; }
  if (act === "importLocked"){ importLocked($("#ob-k").value); return; }
  if (act === "screenOn"){ S._screen = true; render(); try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch(e){} return; }
  if (act === "screenOff"){ S._screen = false; if (location.hash === "#ecran") location.hash = "affichage"; try { document.fullscreenElement && document.exitFullscreen(); } catch(e){} render(); return; }
  if (["wUp","wDown","wOn","wOff"].includes(act)){ const w = affCfg(c).widgets, v = b.dataset.v, i2 = w.indexOf(v);
    if (act === "wOn") w.push(v); if (act === "wOff") w.splice(i2, 1);
    if (act === "wUp" && i2 > 0) [w[i2-1], w[i2]] = [w[i2], w[i2-1]]; if (act === "wDown" && i2 < w.length - 1) [w[i2+1], w[i2]] = [w[i2], w[i2+1]];
    save(); render(); return; }
  if (act === "logout"){ logout(); return; }
  if (act === "loginBack"){ S._login = {step:"mail", mail:(S._login || {}).mail}; render(); return; }
  if (act === "legal"){ e.preventDefault(); showLegal(b.dataset.v); return; }
  if (act === "exportData"){ navigator.clipboard.writeText(JSON.stringify(club(), null, 1)).then(() => toast("Données de l'établissement copiées (format JSON)."), () => toast("Copie refusée par le navigateur.")); return; }
  if (act === "pdfCaisses"){ exportCaissesPDF(s, c, calc(s, c)); return; }
  if (act === "checkOk"){ const u2 = me(); if (!s.checkPar && u2) s.checkPar = fullName(u2.m); s.checkValide = true; s.checkLe = new Date().toISOString(); toast("Check de caisses validé."); }
  if (act === "checkUndo"){ s.checkValide = false; s.checkLe = ""; }
  if (act === "account"){ showAccount(); return; }
  if (act === "more"){ S._more = !S._more; render(); return; }
  if (act === "prodMode"){ S.prodMode = b.dataset.v; save(); render(); return; }
  if (act === "periode"){ S.periode = b.dataset.v; S.repKey = ""; save(); render(); return; }
  if (act === "newSoiree") return askNewSoiree();
  if (act === "delSoiree") return askConfirm("Supprimer la soirée « " + s.nom + " » et toutes ses saisies ?", "okDelSoiree");
  if (act === "delClub") return askConfirm("Supprimer l'établissement « " + c.nom + " » et toutes ses soirées ?", "okDelClub");
  if (act === "reset") return askConfirm("Remettre la démo dans son état de départ ? Tes saisies seront effacées.", "okReset");
  if (act === "open"){ S.cur[c.id] = b.dataset.id; S.view = "tableau"; }
  if (act === "addTarif") s.tarifs.push({nom:"Nouveau tarif", canal:"En ligne", billets:0, prix:10});
  if (act === "addCaisse") s.caisses.push({nom:"Caisse " + (s.caisses.length + 1), attendu:"", encaisse:""});
  if (act === "addPers") s.personnel.push({poste:"DJ", cat:"autre", mode:"f", nb:1, heures:"", taux:200, min:0});
  if (act === "del") s[b.dataset.arr].splice(i, 1);
  if (act === "palier"){ s.personnel = persoFromPalier(c.config, c.config.paliers[i]); toast("Palier " + (i + 1) + " appliqué."); }
  if (act === "filtre") S.filtreSecu = b.dataset.v;
  if (act === "addRec"){ s.recales.push({id:uid(), h:$("#r-h").value, motif:$("#r-m").value, nb:n($("#r-n").value) || 1, par:$("#r-p").value.trim()}); toast("Recalé ajouté."); }
  if (act === "addInt"){ const t = $("#i-t").value.trim(); if (!t){ toast("Décris l'intervention."); return; }
    s.interventions.push({id:uid(), h:$("#i-h").value, texte:t, agents:$("#i-a").value.trim(), sortie:$("#i-s").checked, police:$("#i-po").checked, secours:$("#i-se").checked, par:$("#i-p").value.trim()}); toast("Fiche d'intervention validée."); }
  if (act === "copy"){ const txt = recap(s, c, calc(s, c)); navigator.clipboard.writeText(txt).then(() => toast("Récap copié."), () => toast("Copie refusée : sélectionne le texte du récap en bas de page.")); return; }
  if (act === "addEmp") c.equipe.push({id:(crypto.randomUUID ? crypto.randomUUID() : uid()), nom:"", prenom:"", poste:"", email:"", acces:"Saisie", actif:true});
  if (act === "resetPass"){ const em = c.equipe[i].email; if (MODE !== "online"){ toast("En démo, aucun e-mail n'est envoyé."); return; } sb.auth.resetPasswordForEmail(em, {redirectTo:SITE}).then(({error}) => toast(error ? "Envoi impossible : " + friendlyErr(error) : "Lien envoyé à " + em + ".")); return; }
  if (act === "toggleEmp"){ const t = c.equipe[i], u1 = me(); if (u1 && t === u1.m){ toast("Tu ne peux pas désactiver ton propre compte."); return; }
    if (t.actif !== false && t.acces === "Administrateur" && c.equipe.filter(m => m.acces === "Administrateur" && m.actif !== false).length === 1){ toast("Il faut garder au moins un administrateur actif."); return; }
    t.actif = t.actif === false; toast(fullName(t) + (t.actif ? " peut de nouveau se connecter." : " ne peut plus se connecter.")); }
  if (act === "delEmp"){ const u1 = me(); if (u1 && c.equipe[i] === u1.m){ toast("Tu ne peux pas retirer ton propre compte."); return; } if (c.equipe[i].acces === "Administrateur" && c.equipe.filter(m => m.acces === "Administrateur").length === 1){ toast("Il faut garder au moins un administrateur."); return; } c.equipe.splice(i, 1); }
  if (act === "addCfgCaisse") c.config.caisses.push("Bar " + (c.config.caisses.length + 1));
  if (act === "delCfgCaisse") c.config.caisses.splice(i, 1);
  if (act === "sgConnect"){ const id = String(c.connexions.shotgun.orgId || "").trim(), tk = (($("#sg-token") || {}).value || "").trim(); if (!id){ toast("Renseigne l'Organizer ID."); return; } if (!tk){ toast("Colle le jeton API Shotgun."); return; }
    try { localStorage.setItem(sgTokKey(c.id), tk); } catch(e2){ toast("Ce navigateur refuse d'enregistrer le jeton."); return; }
    sgLog(c, true, "Jeton enregistré sur cet appareil pour l'organisateur " + id); save(); render(); sgSync(c, false); return; }
  if (act === "sgSync"){ sgSync(c, false); return; }
  if (act === "sgForget"){ try { localStorage.removeItem(sgTokKey(c.id)); } catch(e2){} c.connexions.shotgun.connected = false; sgLog(c, true, "Jeton retiré de cet appareil"); }
  save(); render();
});
function route(){ const h = location.hash.slice(1); if (!me()){ render(); return; } if (/access_token|error_description/.test(h)) history.replaceState(null, "", location.pathname); if (h === "ecran"){ S._screen = true; render(); return; } if ([...VIEWS, ...CVIEWS].some(x => x[0] === h)) S.view = h; if (![...VIEWS, ...CVIEWS].some(x => x[0] === S.view)) S.view = "tableau"; S._more = false; render(); }
let wasSmall = window.innerWidth < 700;
window.addEventListener("resize", () => { const sm = window.innerWidth < 700; if (sm !== wasSmall){ wasSmall = sm; render(); } });
window.addEventListener("hashchange", route);
setInterval(() => { document.querySelectorAll("[data-clock]").forEach(e => e.textContent = new Date().toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit", second:"2-digit"})); }, 1000);
setInterval(() => { if (S._screen || S.view === "affichage"){ const ae = document.activeElement; if (!ae || !ae.matches("input,select,textarea")) render(); } }, 15000);
window.addEventListener("storage", e => { if (MODE !== "demo" || e.key !== KEY || !e.newValue) return; try { const keep = {_screen:S._screen, _more:S._more, view:S.view}; S = Object.assign(JSON.parse(e.newValue), keep); render(); } catch(err){} });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S._screen){ S._screen = false; render(); } });
(() => { const im = document.getElementById("intro-img"), it = document.getElementById("intro"); if (!it) return; im.src = LOGO; it.style.setProperty("--logo", `url("${LOGO}")`); setTimeout(() => it.remove(), 2300); })();
boot();
